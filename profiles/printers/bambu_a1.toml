# Bambu Lab A1, buse 0,4 mm acier inoxydable (firmware Bambu Lab).
# Gabarits de « Bambu Lab A1 0.4 nozzle » de Bambu Studio
# (bambulab/BambuStudio, resources/profiles/BBL, gabarits datés du
# 13/05/2026 pour le démarrage et du 13/05/2026 pour la fin ; AGPL-3.0),
# traduits en expressions Rhai par l'import de FabWeave (ADR-0006), sans
# morceau ni réglage laissé de côté :
# - outer_wall_volumetric_speed, flush_volumetric_speeds (lignes de purge et
#   de calibration) : débit volumétrique maximal du filament ;
# - flush_temperatures : température du filament ;
# - spiral_mode, print_sequence : faux, « by layer » (photos de fin) ;
# - first_layer_center_no_wipe_tower : centre de la première couche.
# Machine non essayée par le fablab (qui n'a qu'une X1E).
# Zone exclue : lignes de calibration du gabarit, à l'avant (X 108 à 158,
# Y −0,5 et 1). Accélérations du profil « 0.20mm Standard @BBL A1 » (paroi
# extérieure, première couche), déplacements plafonnés comme la X1E.

format = "fabweave.printer"
version = 2

[printer]
id = "bambu_a1"
name = "Bambu Lab A1"
model = "N2S"
firmware = "bambu"
source = "Bambu Studio (master du 28/10/2026), Bambu Lab A1 0.4 nozzle"

[bed]
size = [256.0, 256.0]
max_height = 256.0
origin = "corner"
plate = "Textured PEI Plate"
exclude = [
    { name = { fr = "lignes de calibration", en = "calibration lines" }, min = [103.0, 0.0], max = [163.0, 5.0] },
]

[nozzle]
diameter = 0.4
high_flow = false
abrasive = false
# Buses de Bambu Studio pour l'A1 (acier trempé en option). Dégagement de la
# tête pour les copies (extruder_clearance_radius / _height_to_rod).
choices = [0.2, 0.4, 0.6, 0.8]
abrasive_available = true
clearance_radius = 57.0
clearance_height = 25.0

[limits]
max_print_speed = 300.0
travel_speed = 300.0
max_z_speed = 15.0
acceleration = 5000.0
travel_acceleration = 9000.0
first_layer_acceleration = 500.0
jerk = 9.0

[layers]
layer_height = 0.2
first_layer_height = 0.2
# Hauteurs par buse : profils « Standard » de Bambu Studio.
by_nozzle = [
    { diameter = 0.2, layer_height = 0.1, first_layer_height = 0.1 },
    { diameter = 0.6, layer_height = 0.3, first_layer_height = 0.3 },
    { diameter = 0.8, layer_height = 0.4, first_layer_height = 0.4 },
]

[gcode]
