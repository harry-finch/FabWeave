# Bambu Lab P1S, buse 0,4 mm acier inoxydable (firmware Bambu Lab).
# Gabarits de « Bambu Lab P1S 0.4 nozzle » de Bambu Studio
# (bambulab/BambuStudio, resources/profiles/BBL, gabarits datés du
# 31/10/2025 pour le démarrage et du 28/04/2023 pour la fin ; AGPL-3.0),
# traduits en expressions Rhai par l'import de FabWeave (ADR-0006), sans
# morceau ni réglage laissé de côté :
# - outer_wall_volumetric_speed, flush_volumetric_speeds (lignes de purge et
#   de calibration) : débit volumétrique maximal du filament ;
# - flush_temperatures : température du filament.
# Machine non essayée par le fablab (qui n'a qu'une X1E).
# Même mécanique que la X1E : zones exclues (coin avant gauche de Bambu
# Studio, bande avant des lignes de purge, Y < 13 mm), limites et
# accélérations identiques.

format = "fabweave.printer"
version = 2

[printer]
id = "bambu_p1s"
name = "Bambu Lab P1S"
model = "C12"
firmware = "bambu"
source = "Bambu Studio (master du 28/10/2026), Bambu Lab P1S 0.4 nozzle"

[bed]
size = [256.0, 256.0]
max_height = 250.0
origin = "corner"
plate = "Textured PEI Plate"
exclude = [
    { name = { fr = "coin avant gauche", en = "front left corner" }, min = [0.0, 0.0], max = [18.0, 28.0] },
    { name = { fr = "lignes de purge", en = "purge lines" }, min = [18.0, 0.0], max = [241.0, 13.0] },
]

[nozzle]
diameter = 0.4
high_flow = false
abrasive = false
# Buses de Bambu Studio pour la P1S (acier trempé en option). Dégagement de
# la tête pour les copies (extruder_clearance_radius / _height_to_rod).
choices = [0.2, 0.4, 0.6, 0.8]
abrasive_available = true
clearance_radius = 57.0
clearance_height = 34.0

[limits]
max_print_speed = 300.0
travel_speed = 300.0
max_z_speed = 15.0
acceleration = 5000.0
travel_acceleration = 9000.0
first_layer_acceleration = 500.0
jerk = 9.0

[layers]
layer_height = 0.2
first_layer_height = 0.2
# Hauteurs par buse : profils « Standard » de Bambu Studio.
by_nozzle = [
    { diameter = 0.2, layer_height = 0.1, first_layer_height = 0.1 },
    { diameter = 0.6, layer_height = 0.3, first_layer_height = 0.3 },
    { diameter = 0.8, layer_height = 0.4, first_layer_height = 0.4 },
]

[gcode]
# Vignette dans le G-code (bloc THUMBNAIL_BLOCK de Bambu Studio).
thumbnails = ["300x300/PNG"]
start = """
;===== machine: P1S-0.4 ========================
;===== date: 20251031 =====================
;===== turn on the HB fan & MC board fan =================
M104 S75 ;set extruder temp to turn on the HB fan and prevent filament oozing from nozzle
M710 A1 S255 ;turn on MC fan by default(P1S)
;===== reset machine status =================
M290 X40 Y40 Z2.6666666
G91
M17 Z0.4 ; lower the z-motor current
G380 S2 Z30 F300 ; G380 is same as G38; lower the hotbed , to prevent the nozzle is below the hotbed
G380 S2 Z-25 F300 ;
G1 Z5 F300;
G90
M17 X1.2 Y1.2 Z0.75 ; reset motor current to default
M960 S5 P1 ; turn on logo lamp
G90
M220 S100 ;Reset Feedrate
M221 S100 ;Reset Flowrate
M73.2   R1.0 ;Reset left time magnitude
M1002 set_gcode_claim_speed_level : 5
M221 X0 Y0 Z0 ; turn off soft endstop to prevent protential logic problem
G29.1 Z{0.0} ; clear z-trim value first
M204 S10000 ; init ACC set to 10m/s^2

;===== heatbed preheat ====================
M1002 gcode_claim_action:54
M140 S{first_layer_bed_temperature} ;set bed temp
M190 S{first_layer_bed_temperature} ;wait for bed temp



;=============turn on fans to prevent PLA jamming=================
{if filament_type == "PLA" { `

    ${if (bed_temperature > 45.0) || (first_layer_bed_temperature > 45.0) { `

    M106 P3 S180
    ` } else { "" }};Prevent PLA from jamming
` } else { "" }}
M106 P2 S100 ; turn on big fan ,to cool down toolhead

;===== prepare print temperature and material ==========
M104 S{first_layer_temperature} ;set extruder temp
G91
G0 Z10 F1200
G90
G28 X
M975 S1 ; turn on
G1 X60 F12000
G1 Y245
G1 Y265 F3000
M620 M
M620 S{0.0}A   ; switch material if AMS exist
    M109 S{first_layer_temperature}
    G1 X120 F12000

    G1 X20 Y50 F12000
    G1 Y-3
    T{0.0}
    G1 X54 F12000
    G1 Y265
    M400
M621 S{0.0}A
M620.1 E F{max_volumetric_speed / 2.4053 * 60.0} T{temperature}


M412 S1 ; ===turn on filament runout detection===

M109 S250 ;set nozzle to common flush temp
M106 P1 S0
G92 E0
G1 E50 F200
M400
M104 S{first_layer_temperature}
G92 E0
G1 E50 F200
M400
M106 P1 S255
G92 E0
G1 E5 F300
M109 S{first_layer_temperature - 20.0} ; drop nozzle temp, make filament shink a bit
G92 E0
G1 E-0.5 F300

G1 X70 F9000
G1 X76 F15000
G1 X65 F15000
G1 X76 F15000
G1 X65 F15000; shake to put down garbage
G1 X80 F6000
G1 X95 F15000
G1 X80 F15000
G1 X165 F15000; wipe and shake
M400
M106 P1 S0
;===== prepare print temperature and material end =====


;===== wipe nozzle ===============================
M1002 gcode_claim_action : 14
M975 S1
M106 S255
G1 X65 Y230 F18000
G1 Y264 F6000
M109 S{first_layer_temperature - 20.0}
G1 X100 F18000 ; first wipe mouth

G0 X135 Y253 F20000  ; move to exposed steel surface edge
G28 Z P0 T300; home z with low precision,permit 300deg temperature
G29.2 S0 ; turn off ABL
G0 Z5 F20000

G1 X60 Y265
G92 E0
G1 E-0.5 F300 ; retrack more
G1 X100 F5000; second wipe mouth
G1 X70 F15000
G1 X100 F5000
G1 X70 F15000
G1 X100 F5000
G1 X70 F15000
G1 X100 F5000
G1 X70 F15000
G1 X90 F5000
G0 X128 Y261 Z-1.5 F20000  ; move to exposed steel surface and stop the nozzle
M104 S140 ; set temp down to heatbed acceptable
M106 S255 ; turn on fan (G28 has turn off fan)

M221 S; push soft endstop status
M221 Z0 ;turn off Z axis endstop
G0 Z0.5 F20000
G0 X125 Y259.5 Z-1.01
G0 X131 F211
G0 X124
G0 Z0.5 F20000
G0 X125 Y262.5
G0 Z-1.01
G0 X131 F211
G0 X124
G0 Z0.5 F20000
G0 X125 Y260.0
G0 Z-1.01
G0 X131 F211
G0 X124
G0 Z0.5 F20000
G0 X125 Y262.0
G0 Z-1.01
G0 X131 F211
G0 X124
G0 Z0.5 F20000
G0 X125 Y260.5
G0 Z-1.01
G0 X131 F211
G0 X124
G0 Z0.5 F20000
G0 X125 Y261.5
G0 Z-1.01
G0 X131 F211
G0 X124
G0 Z0.5 F20000
G0 X125 Y261.0
G0 Z-1.01
G0 X131 F211
G0 X124
G0 X128
G2 I0.5 J0 F300
G2 I0.5 J0 F300
G2 I0.5 J0 F300
G2 I0.5 J0 F300

M109 S140 ; wait nozzle temp down to heatbed acceptable
G2 I0.5 J0 F3000
G2 I0.5 J0 F3000
G2 I0.5 J0 F3000
G2 I0.5 J0 F3000

M221 R; pop softend status
G1 Z10 F1200
M400
G1 Z10
G1 F30000
G1 X230 Y15
G29.2 S1 ; turn on ABL
;G28 ; home again after hard wipe mouth
M106 S0 ; turn off fan , too noisy
;===== wipe nozzle end ================================


;===== bed leveling ==================================
M1002 judge_flag g29_before_print_flag
M622 J1

    M1002 gcode_claim_action : 1
    G29 A X{first_layer_min_x} Y{first_layer_min_y} I{first_layer_max_x - first_layer_min_x} J{first_layer_max_y - first_layer_min_y}
    M400
    M500 ; save cali data

M623
;===== bed leveling end ================================

;===== home after wipe mouth============================
M1002 judge_flag g29_before_print_flag
M622 J0

    M1002 gcode_claim_action : 13
    G28

M623
;===== home after wipe mouth end =======================

M975 S1 ; turn on vibration supression


;=============turn on fans to prevent PLA jamming=================
{if filament_type == "PLA" { `

    ${if (bed_temperature > 45.0) || (first_layer_bed_temperature > 45.0) { `

    M106 P3 S180
    ` } else { "" }};Prevent PLA from jamming
` } else { "" }}
M106 P2 S100 ; turn on big fan ,to cool down toolhead


M104 S{first_layer_temperature} ; set extrude temp earlier, to reduce wait time

;===== mech mode fast check============================
G1 X128 Y128 Z10 F20000
M400 P200
M970.3 Q1 A7 B30 C80  H15 K0
M974 Q1 S2 P0

G1 X128 Y128 Z10 F20000
M400 P200
M970.3 Q0 A7 B30 C90 Q0 H15 K0
M974 Q0 S2 P0

M975 S1
G1 F30000
G1 X230 Y15
G28 X ; re-home XY
;===== fmech mode fast check============================


;===== nozzle load line ===============================
M975 S1
G90
M83
T1000
G1 X18.0 Y1.0 Z0.8 F18000;Move to start position
M109 S{first_layer_temperature}
G1 Z0.2
G0 E2 F300
G0 X240 E15 F{max_volumetric_speed / (0.3 * 0.5) * 60.0}
G0 Y11 E0.700 F{max_volumetric_speed / (0.3 * 0.5) / 4.0 * 60.0}
G0 X239.5
G0 E0.2
G0 Y1.5 E0.700
G0 X18 E15 F{max_volumetric_speed / (0.3 * 0.5) * 60.0}
M400

;===== for Textured PEI Plate , lower the nozzle as the nozzle was touching topmost of the texture when homing ==
;curr_bed_type={bed_type}
{if bed_type == "Textured PEI Plate" { `

G29.1 Z${num(-0.04)} ; for Textured PEI Plate
` } else { "" }}
;========turn off light and wait extrude temperature =============
M1002 gcode_claim_action : 0
M106 S0 ; turn off fan
M106 P2 S0 ; turn off big fan
M106 P3 S0 ; turn off chamber fan

M975 S1 ; turn on mech mode supression
"""
end = """
;===== date: 20230428 =====================
M400 ; wait for buffer to clear
G92 E0 ; zero the extruder
G1 E-0.8 F1800 ; retract
G1 Z{max_z + 0.5} F900 ; lower z a little
G1 X65 Y245 F12000 ; move to safe pos 
G1 Y265 F3000

G1 X65 Y245 F12000
G1 Y265 F3000
M140 S0 ; turn off bed
M106 S0 ; turn off fan
M106 P2 S0 ; turn off remote part cooling fan
M106 P3 S0 ; turn off chamber cooling fan

G1 X100 F12000 ; wipe
; pull back filament to AMS
M620 S255
G1 X20 Y50 F12000
G1 Y-3
T255
G1 X65 F12000
G1 Y265
G1 X100 F12000 ; wipe
M621 S255
M104 S0 ; turn off hotend

M622.1 S1 ; for prev firware, default turned on
M1002 judge_flag timelapse_record_flag
M622 J1
    M400 ; wait all motion done
    M991 S0 P-1 ;end smooth timelapse at safe pos
    M400 S3 ;wait for last picture to be taken
M623; end of "timelapse_record_flag"

M400 ; wait all motion done
M17 S
M17 Z0.4 ; lower z motor current to reduce impact if there is something in the bottom
{if (max_z + 100.0) < 250.0 { `

    G1 Z${num(max_z + 100.0)} F600
    G1 Z${num(max_z + 98.0)}
` } else { `

    G1 Z250 F600
    G1 Z248
` }}
M400 P100
M17 R ; restore z current

M220 S100  ; Reset feedrate magnitude
M201.2 K1.0 ; Reset acc magnitude
M73.2   R1.0 ;Reset left time magnitude
M1002 set_gcode_claim_speed_level : 0

M17 X0.8 Y0.8 Z0.5 ; lower motor current to 45% power
"""
# Pause (`machine_pause_gcode` de Bambu Studio).
pause = """
M400 U1
"""
