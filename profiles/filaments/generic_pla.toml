# PLA générique, buse 0,4 mm. Valeurs d'après « Generic PLA @PG / @PGIS » de
# PrusaSlicer (PrusaResearch 2.5.13), températures de la version sans
# Input Shaper : les modèles de FabWeave impriment lentement.

format = "fabweave.filament"
version = 2

[filament]
id = "generic_pla"
name = { fr = "PLA générique", en = "Generic PLA" }
type = "PLA"
diameter = 1.75
density = 1.24
flow_multiplier = 1.0
pressure_advance = 0.036

[temperature]
first_layer = 215.0
nozzle = 210.0
bed_first_layer = 60.0
bed = 60.0
probe = 170.0
idle = 170.0
chamber = 20.0

[speed]
nominal = 40.0
first_layer = 20.0
max_volumetric = 15.0
# Débit maximal par buse (PrusaSlicer : Generic PLA @PG 0.8, @COREONE HF0.4 à HF0.8) ; buse haut débit sans
# diamètre : HF 0,4 et toute autre.
by_nozzle = [
    { diameter = 0.8, max_volumetric = 19.0 },
    { high_flow = true, max_volumetric = 21.0 },
    { diameter = 0.5, high_flow = true, max_volumetric = 24.0 },
    { diameter = 0.6, high_flow = true, max_volumetric = 28.0 },
    { diameter = 0.8, high_flow = true, max_volumetric = 35.0 },
]

[cooling]
fan = 100.0
first_layer_fan = 0.0
bridge_fan = 100.0

[retraction]
length = 0.7
speed = 35.0
z_hop = 0.2
min_travel = 1.5
