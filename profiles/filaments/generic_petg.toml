# PETG générique, buse 0,4 mm. Valeurs d'après « Generic PETG @PGIS » et
# « @COREONE » de PrusaSlicer (PrusaResearch 2.5.13).

format = "fabweave.filament"
version = 2

[filament]
id = "generic_petg"
name = { fr = "PETG générique", en = "Generic PETG" }
type = "PETG"
diameter = 1.75
density = 1.27
flow_multiplier = 1.0
pressure_advance = 0.053

[temperature]
first_layer = 240.0
nozzle = 240.0
bed_first_layer = 85.0
bed = 90.0
probe = 175.0
idle = 130.0
chamber = 35.0

[speed]
nominal = 35.0
first_layer = 20.0
max_volumetric = 10.0
# Débit maximal par buse (PrusaSlicer : Generic PETG @PG 0.6 et 0.8, @COREONE HF0.4 à HF0.8) ; buse haut débit sans
# diamètre : HF 0,4 et toute autre.
by_nozzle = [
    { diameter = 0.6, max_volumetric = 17.0 },
    { diameter = 0.8, max_volumetric = 22.0 },
    { high_flow = true, max_volumetric = 21.0 },
    { diameter = 0.5, high_flow = true, max_volumetric = 24.0 },
    { diameter = 0.6, high_flow = true, max_volumetric = 27.0 },
    { diameter = 0.8, high_flow = true, max_volumetric = 34.0 },
]

[cooling]
fan = 40.0
first_layer_fan = 0.0
bridge_fan = 60.0

[retraction]
length = 0.8
speed = 35.0
z_hop = 0.15
min_travel = 1.5
