# PETG générique, buse 0,4 mm. Valeurs d'après « Generic PETG @PGIS » et
# « @COREONE » de PrusaSlicer (PrusaResearch 2.5.13).

format = "fabweave.filament"
version = 1

[filament]
id = "generic_petg"
name = "PETG générique"
type = "PETG"
diameter = 1.75
density = 1.27
flow_multiplier = 1.0
pressure_advance = 0.053

[temperature]
first_layer = 240.0
nozzle = 240.0
bed_first_layer = 85.0
bed = 90.0
probe = 175.0
idle = 130.0
chamber = 35.0

[speed]
nominal = 35.0
first_layer = 20.0
max_volumetric = 10.0

[cooling]
fan = 40.0
first_layer_fan = 0.0
bridge_fan = 60.0

[retraction]
length = 0.8
speed = 35.0
z_hop = 0.15
min_travel = 1.5
