# Installeur Windows de l'application de bureau. Tauri ne compile pas
# pour Windows depuis macOS : la construction se fait sur un poste Windows
# de GitHub. Lancer depuis l'onglet Actions en donnant la version publiée
# (ex. v0.9.0-beta.1) : l'installeur est ajouté à cette version.
name: Application Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version publiée où ajouter l'installeur (vide : fichier gardé en artefact seulement)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # La version vient de rust-toolchain.toml.
      - name: Rust
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/fabweave-desktop

      - name: Dépendances de l'interface
        run: npm ci
        working-directory: ui

      # Le MSI refuse une version « 0.9.0-beta.1 » : seul l'installeur NSIS est produit.
      - name: Installeur
        run: npm exec --yes --package=@tauri-apps/cli@2.12.3 -- tauri build --bundles nsis
        working-directory: crates/fabweave-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: FabWeave-windows
          path: crates/fabweave-desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Ajout à la version publiée
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" crates/fabweave-desktop/target/release/bundle/nsis/*.exe --clobber
