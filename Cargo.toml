[workspace]
resolver = "3"
members = ["crates/fabweave-core", "crates/fabweave-wasm", "crates/fabweave-cli"]
exclude = ["crates/fabweave-desktop"]

[workspace.package]
version = "0.9.0-beta.1"
edition = "2021"
rust-version = "1.88"
authors = ["Stéphane Muller"]
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Tests en mode debug : dépendances optimisées (l'interpréteur Rhai surtout)
# et moteur un peu optimisé ; sinon le catalogue sur sept imprimantes passe
# de 47 s à près de 8 min.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.fabweave-core]
opt-level = 1
