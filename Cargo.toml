[workspace]
resolver = "3"
members = ["crates/fabweave-core", "crates/fabweave-wasm", "crates/fabweave-cli"]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.88"
authors = ["Stéphane Muller"]
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
