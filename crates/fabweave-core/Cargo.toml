[package]
name = "fabweave-core"
description = "Moteur FabWeave : modèles .weave (TOML + Rhai), parcours, physique de l'extrusion, G-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
indexmap = { version = "2", features = ["serde"] }
libm = "0.2"
# Décalage des contours (anneaux concentriques, API-14) : arithmétique entière,
# même résultat en natif et en WebAssembly. Rust pur, comme dans FabVents.
i_overlay = { version = "9.1.0", default-features = false }
# Paquet `.gcode.3mf` des Bambu Lab : somme MD5 du G-code, compression
# (ZIP et vignettes PNG). Rust pur, sans IO.
md-5 = { version = "0.10", default-features = false }
miniz_oxide = "0.8"
# Bac à sable : pas de modules (aucun accès fichier), pas d'horloge (déterminisme).
rhai = { version = "1", default-features = false, features = ["std", "no_module", "no_time", "no_custom_syntax"] }
serde.workspace = true
serde_json.workspace = true
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde", "std", "preserve_order"] }
