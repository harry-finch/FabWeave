# Hors du workspace (voir son `exclude`) : Tauri exige `ui/dist` à la
# compilation, et les tests du moteur n'ont pas à en dépendre.
[package]
name = "fabweave-desktop"
description = "Application de bureau FabWeave (Tauri) : l'interface et son moteur WebAssembly dans une fenêtre"
version = "0.9.0-beta.1"
edition = "2021"
rust-version = "1.88"
authors = ["Stéphane Muller"]
license = "GPL-3.0-or-later"
publish = false
# Choisit des dépendances compatibles avec `rust-version`.
resolver = "3"

[[bin]]
name = "fabweave-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Activée par le CLI Tauri pour les builds de distribution.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
